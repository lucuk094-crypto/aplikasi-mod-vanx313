<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7e8" />
    <title>Offline — VAN MOD</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fff7e8;
        color: #1c1c1c;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 380px;
        background: #fff;
        border: 2.5px solid #1b1b1b;
        border-radius: 14px;
        box-shadow: 6px 6px 0 #1b1b1b;
        padding: 36px 28px;
      }
      .logo {
        width: 58px;
        height: 58px;
        margin: 0 auto;
        background: #b2f800;
        color: #141414;
        font-weight: 900;
        font-size: 32px;
        border-radius: 13px;
        border: 2.5px solid #1b1b1b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 22px; margin-top: 18px; }
      p { color: #6f6553; margin-top: 10px; font-size: 14.5px; line-height: 1.6; }
      button {
        margin-top: 22px;
        background: #b2f800;
        color: #141414;
        border: 2.5px solid #1b1b1b;
        border-radius: 11px;
        box-shadow: 4px 4px 0 #1b1b1b;
        font-weight: 800;
        font-size: 14px;
        padding: 13px 26px;
        cursor: pointer;
        font-family: inherit;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 0 0 0 #1b1b1b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">V</div>
      <h1>Kamu sedang offline</h1>
      <p>Periksa koneksi internetmu, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
