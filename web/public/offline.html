<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c07" />
    <title>Offline — VAN MOD</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0c07;
        color: #f2f6e9;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 380px;
        background: #11160c;
        border: 1.5px solid #26301b;
        border-radius: 14px;
        box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.55);
        padding: 36px 28px;
      }
      .logo {
        width: 58px;
        height: 58px;
        margin: 0 auto;
        background: #b2f800;
        color: #0a0c07;
        font-weight: 900;
        font-size: 32px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 22px; margin-top: 18px; }
      p { color: #93a086; margin-top: 10px; font-size: 14.5px; line-height: 1.6; }
      button {
        margin-top: 22px;
        background: #b2f800;
        color: #0a0c07;
        border: none;
        border-radius: 11px;
        font-weight: 800;
        font-size: 14px;
        padding: 13px 26px;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">V</div>
      <h1>Kamu sedang offline</h1>
      <p>Periksa koneksi internetmu, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
