<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VAN//MOD - Admin Terminal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#9bd900",
                        "on-surface": "#e0e5cf",
                        "on-primary-fixed": "#131f00",
                        "primary-fixed": "#b2f800",
                        "on-tertiary-fixed-variant": "#3a4858",
                        "primary-container": "#b2f800",
                        "inverse-primary": "#486800",
                        "surface-variant": "#323728",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#586577",
                        "inverse-on-surface": "#2d3223",
                        "primary": "#ffffff",
                        "on-secondary-fixed-variant": "#45464e",
                        "secondary-fixed-dim": "#c6c6cf",
                        "on-primary": "#243600",
                        "surface-container-highest": "#323728",
                        "on-secondary-container": "#b4b4bd",
                        "on-tertiary": "#243141",
                        "on-primary-container": "#4d6e00",
                        "inverse-surface": "#e0e5cf",
                        "surface-container-high": "#272c1d",
                        "on-secondary": "#2f3037",
                        "outline-variant": "#424a33",
                        "surface-bright": "#363b2c",
                        "surface-container-low": "#191d10",
                        "tertiary": "#ffffff",
                        "on-background": "#e0e5cf",
                        "outline": "#8c9479",
                        "tertiary-container": "#d6e4f8",
                        "tertiary-fixed-dim": "#bac8dc",
                        "surface": "#101508",
                        "on-surface-variant": "#c2caad",
                        "secondary-fixed": "#e2e1eb",
                        "surface-dim": "#101508",
                        "on-secondary-fixed": "#1a1b22",
                        "surface-container": "#1d2114",
                        "surface-tint": "#9bd900",
                        "on-error": "#690005",
                        "tertiary-fixed": "#d6e4f8",
                        "background": "#080808", /* Custom background per prompt */
                        "secondary-container": "#45464e",
                        "on-tertiary-fixed": "#0f1c2b",
                        "error": "#ffb4ab",
                        "secondary": "#c6c6cf",
                        "surface-container-lowest": "#0b1005",
                        "on-primary-fixed-variant": "#364e00",
                        "neon-green": "#B7FF00", /* Custom neon green per prompt */
                        "card-bg": "#111111" /* Custom card background per prompt */
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "2xl": "48px",
                        "margin-desktop": "40px",
                        "3xl": "64px",
                        "gutter": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],

                    "fontSize": {

                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }]
                    }
                }
            }
        }

<style>
        body {
            background-color: #080808; /* Fallback */
            color: #ffffff;
            overflow: hidden; /* Prevent scrolling for a true terminal feel */
        }
        
        .brutalist-input {
            background-color: #000000;
            border: 2px solid #A1A1AA;
            color: #ffffff;
            transition: all 0.2s ease-in-out;
        }
        
        .brutalist-input:focus {
            border-color: #B7FF00;
            outline: none;
            box-shadow: 4px 4px 0px 0px rgba(183, 255, 0, 0.2);
        }

        .brutalist-button {
            background-color: #B7FF00;
            color: #080808;
            border: 2px solid #B7FF00;
            transition: all 0.1s ease-in-out;
        }

        .brutalist-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px 0px rgba(183, 255, 0, 1);
        }

        .brutalist-button:active {
            transform: translate(0px, 0px);
            box-shadow: 0px 0px 0px 0px rgba(183, 255, 0, 1);
        }

        .brutalist-card {
            background-color: #111111;
            border: 2px solid #ffffff;
        }
        
        .loading-slash {
            display: inline-block;
            animation: slide-slash 2s infinite linear;
        }

        @keyframes slide-slash {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        
        /* Grid background pattern */
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-center items-center relative font-sans selection:bg-neon-green selection:text-black">
<!-- Ambient Background Elements -->
<div class="grid-bg"></div>
<div class="absolute top-0 right-0 w-1/3 h-1/3 bg-neon-green/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-neon-green/5 blur-[120px] rounded-full pointer-events-none"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md px-margin-mobile relative z-10">
<!-- Login Card -->
<div class="brutalist-card p-xl shadow-2xl relative overflow-hidden group">
<!-- Card Glitch Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-neon-green scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-500"></div>
<!-- Header Section -->
<div class="mb-xl flex flex-col gap-sm">
<div class="flex items-center gap-xs">
<span class="font-display-lg text-display-lg font-black tracking-tighter text-neon-green">VAN</span>
<span class="font-display-lg text-display-lg font-black tracking-tighter text-outline-variant">//</span>
<span class="font-display-lg text-display-lg font-black tracking-tighter text-primary">MOD</span>
</div>
<div class="h-[2px] w-full bg-outline-variant my-sm relative overflow-hidden">
<div class="absolute inset-y-0 left-0 bg-neon-green w-1/4 loading-slash"></div>
</div>
<h1 class="font-headline-sm text-headline-sm uppercase text-on-surface">ADMIN ACCESS <span class="text-neon-green">//</span> TERMINAL LOGIN</h1>
</div>
<!-- Error State (Hidden by default, shown for demonstration) -->
<div class="mb-lg p-sm border-2 border-error bg-error-container/20 flex items-start gap-sm hidden" id="error-message">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="font-label-md text-label-md text-error uppercase">INVALID ADMIN CREDENTIALS.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault(); document.getElementById('error-message').classList.remove('hidden');">
<!-- Email Field -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md uppercase text-on-surface-variant tracking-widest" for="email">Operator ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">badge</span>
<input autocomplete="username" class="brutalist-input w-full p-sm pl-[40px] font-body-md text-body-md" id="email" placeholder="admin@vanmod.sys" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs relative">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md uppercase text-on-surface-variant tracking-widest" for="password">Access Code</label>
<button class="font-label-sm text-label-sm uppercase text-outline-variant hover:text-neon-green transition-colors" onclick="togglePassword()" type="button">
                            SHOW
                        </button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">key</span>
<input autocomplete="current-password" class="brutalist-input w-full p-sm pl-[40px] font-body-md text-body-md" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-xs cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 border-2 border-outline-variant bg-black group-hover:border-neon-green transition-colors">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-neon-green opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm uppercase text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Session</span>
</label>
</div>
<!-- Submit Button -->
<button class="brutalist-button w-full py-md font-headline-sm text-headline-sm uppercase font-bold tracking-widest mt-md flex justify-center items-center gap-sm" type="submit">
                    LOGIN
                    <span class="material-symbols-outlined">login</span>
</button>
</form>
</div>
</main>
<!-- Global Footer -->
<footer class="fixed bottom-0 w-full py-lg px-margin-desktop flex justify-between items-center z-10 pointer-events-none">
<div class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">
            © 2024 VAN//MOD. ALL RIGHTS RESERVED.
        </div>
<div class="flex items-center gap-xs">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neon-green opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-neon-green"></span>
</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-neon-green font-bold">SYSTEM ONLINE</span>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = event.currentTarget;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'HIDE';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'SHOW';
            }
        }
    </script>

    <!-- Firebase and App Scripts -->
    <script type="module" src="src/js/app.js"></script>
    <script type="module" src="src/js/adminLogin.js"></script>
</body></html>
