<style>
        body {
            background-color: #080808;
            color: #e0e5cf;
        }
        .brutalist-input {
            background-color: #000000;
            border: 2px solid #A1A1AA;
            color: white;
            transition: border-color 0.2s ease-in-out;
        }
        .brutalist-input:focus {
            border-color: #B7FF00;
            outline: none;
        }
        .brutalist-card {
            background-color: #111111;
            border: 1px solid #1F1F1F;
        }
        .brutalist-btn-primary {
            background-color: #B7FF00;
            color: #080808;
            border: 2px solid #B7FF00;
            transition: all 0.2s ease-in-out;
        }
        .brutalist-btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px 0px #B7FF00;
        }
        .brutalist-btn-destructive {
            background-color: transparent;
            color: #ffb4ab;
            border: 2px solid #ffb4ab;
            transition: all 0.2s ease-in-out;
        }
        .brutalist-btn-destructive:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px 0px #ffb4ab;
            background-color: rgba(255, 180, 171, 0.1);
        }
        
        /* Custom Toggle */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #B7FF00;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #B7FF00;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: #080808;
        }
        .toggle-label {
            width: 48px;
            height: 24px;
            background-color: #323728;
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            border: 2px solid #8c9479;
        }
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s ease-in-out;
        }
        .toggle-checkbox {
            display: none;
        }

        /* Loading Slashes Animation */
        @keyframes slashes {
            0% { transform: translateX(0); }
            50% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }
        .loading-slashes {
            display: inline-block;
            animation: slashes 1s infinite linear;
            color: #B7FF00;
        }

        /* Scanline effect */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 9999;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            animation: scanline 10s linear infinite;
            opacity: 0.1;
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
    </style>
